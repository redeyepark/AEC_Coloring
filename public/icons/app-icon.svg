<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>

  <!-- Color Palette Circle Background -->
  <circle cx="256" cy="240" r="180" fill="#F5F5F5"/>

  <!-- Palette Colors - Rainbow Arc -->
  <path d="M120 240 A136 136 0 0 1 180 140" stroke="#EF5350" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M180 140 A136 136 0 0 1 256 104" stroke="#FFA726" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M256 104 A136 136 0 0 1 332 140" stroke="#FFEE58" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M332 140 A136 136 0 0 1 392 240" stroke="#66BB6A" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M392 240 A136 136 0 0 1 332 340" stroke="#42A5F5" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M332 340 A136 136 0 0 1 256 376" stroke="#AB47BC" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M256 376 A136 136 0 0 1 180 340" stroke="#EC407A" stroke-width="40" stroke-linecap="round" fill="none"/>

  <!-- Center White Circle -->
  <circle cx="256" cy="240" r="80" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>

  <!-- Paintbrush -->
  <g transform="translate(220, 200) rotate(-30)">
    <!-- Brush Handle -->
    <rect x="20" y="60" width="32" height="100" rx="4" fill="#8D6E63"/>
    <rect x="24" y="60" width="8" height="100" fill="#A1887F"/>
    <!-- Brush Ferrule -->
    <rect x="16" y="50" width="40" height="16" rx="2" fill="#9E9E9E"/>
    <rect x="16" y="52" width="40" height="4" fill="#BDBDBD"/>
    <!-- Brush Bristles -->
    <path d="M16 50 Q36 -10 56 50" fill="#FFA726"/>
    <path d="M20 48 Q36 0 52 48" fill="#FFCC80"/>
  </g>

  <!-- App Name Area -->
  <rect x="80" y="420" width="352" height="60" rx="12" fill="#2196F3"/>
  <text x="256" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">오늘의 컬러링</text>
</svg>
