<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>

  <!-- Color Palette - Paint drops arranged in circle -->
  <!-- Red -->
  <circle cx="256" cy="120" r="50" fill="#EF5350"/>
  <!-- Orange -->
  <circle cx="352" cy="168" r="50" fill="#FFA726"/>
  <!-- Yellow -->
  <circle cx="392" cy="268" r="50" fill="#FFEE58"/>
  <!-- Green -->
  <circle cx="352" cy="368" r="50" fill="#66BB6A"/>
  <!-- Blue -->
  <circle cx="256" cy="416" r="50" fill="#42A5F5"/>
  <!-- Purple -->
  <circle cx="160" cy="368" r="50" fill="#AB47BC"/>
  <!-- Pink -->
  <circle cx="120" cy="268" r="50" fill="#EC407A"/>
  <!-- Cyan -->
  <circle cx="160" cy="168" r="50" fill="#26C6DA"/>

  <!-- Center - Paintbrush icon -->
  <g transform="translate(256, 268)">
    <!-- Brush Handle -->
    <rect x="-16" y="0" width="32" height="80" rx="4" fill="#8D6E63"/>
    <rect x="-12" y="0" width="8" height="80" fill="#A1887F"/>
    <!-- Brush Ferrule -->
    <rect x="-20" y="-10" width="40" height="14" rx="2" fill="#9E9E9E"/>
    <!-- Brush Tip -->
    <ellipse cx="0" cy="-36" rx="24" ry="30" fill="#2196F3"/>
    <ellipse cx="-6" cy="-40" rx="8" ry="12" fill="#64B5F6"/>
  </g>
</svg>
